<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="x-ua-compatible" content="ie=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>GRN Bin Update</title>
		<link rel="stylesheet" href="bootstrap.min.css">
		<style>
			table td { min-width: 200px; }
			caption {font-weight: bold;}
			table th {
				text-align: right;
				min-width: 100px;
			}
			.bg-danger {
			    background-color: #bc3e31;
			    color: #fff;
			}
		</style>
	</head>
	<body>
		<h1 class="text-center" style="margin-bottom:50px;">GRN BIN UPDATE (INWARD)</h1>
		<div class="container text-center">
			<form id="bc-form" action="" method="POST" class="form-inline" role="form">
				<div class="form-group">
					<div class="input-group">
				  		<div class="input-group-addon">Barcode</div>
				  		<input type="text" name="barcode" class="form-control" id="barcode" required>
					</div>
				</div>
				<div class="form-group">
					<div class="input-group">
				  		<div class="input-group-addon">BIN</div>
				  		<input type="text" name="bin" class="form-control" id="bin" required>
					</div>
				</div>
				<button type="submit" id="submit" class="btn btn-primary">Submit</button>
			</form>
			<table align="center" class="table table-bordered" style="width:auto; margin-top:50px;">
				<caption id="feedback" class="text-center"></caption>
				<tbody>
					<tr>
						<th class="active">Zone</th>
						<td id="zone"></td>
					</tr>
					<tr>
						<th class="active">GNR No.</th>
						<td id="gnr_no"></td>
					</tr>
					<tr>
						<th class="active">Item Code</th>
						<td id="item_code"></td>
					</tr>
					<tr>
						<th class="active">Qty</th>
						<td id="qty"></td>
					</tr>
					<tr>
						<th class="active">Ctn/Pallet</th>
						<td id="pallet"></td>
					</tr>
					<tr>
						<th class="active">BIN</th>
						<td id="bin_no"></td>
					</tr>
				</tbody>
			</table>
		</div>


		<script src="js/jquery-1.12.4.min.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
